name: Setup
description: Setup pnpm and Node.js, restore the pnpm store, and install dependencies

inputs:
  playwright:
    description: Also restore and install the Chromium build Playwright pins
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

    - name: Setup Node.js
      uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      run: |
        set -euo pipefail
        pnpm install --frozen-lockfile --prefer-offline

    # Browser builds are pinned to the Playwright version, so that is the only
    # thing the cache key needs — a lockfile hash would throw the ~130 MB
    # download away on every unrelated dependency bump.
    - name: Resolve Playwright version
      id: playwright
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        set -euo pipefail
        version="$(pnpm exec playwright --version | awk '{ print $2 }')"
        printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

    - name: Restore Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    # Still unconditional on a cache hit: `install` is a no-op once the browser
    # is on disk, but the system libraries it links against live outside
    # ~/.cache and are not cached with it.
    - name: Install Playwright browsers
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        set -euo pipefail
        pnpm exec playwright install chromium --with-deps
