name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types, dead code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:check
      # Formatting is fixed automatically on commit by lint-staged, which only
      # sees staged files. This is the check that catches everything else.
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm knip

  unit:
    name: Unit tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  mutation:
    name: Mutation score (unit tier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Grades the unit tier's assertions, not its coverage. Fails under the
      # `thresholds.break` in stryker.config.mjs — see docs/mutation-testing.md.
      - run: pnpm test:mutation
      - name: Upload mutation report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 7

  arch:
    name: Architecture tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:arch

  browser:
    name: Browser tier (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm exec vitest run --project=default --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The shard is written "1/2"; artifact names may not contain a slash.
          name: vitest-traces-browser-${{ strategy.job-index }}
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  a11y:
    name: Accessibility tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test:a11y
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-traces-a11y
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  touch:
    name: Touch tier (coarse pointer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # Its own Chromium boot, and worth it: every other browser job launches
      # a desktop profile, so a mobile-first app had no job that experienced
      # it the way its users do.
      - run: pnpm test:touch
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-traces-touch
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  # The visual tier is a local tool by default: its screenshot baselines are
  # platform-specific (font rendering differs between macOS and Linux). To
  # run it in CI, generate Linux baselines once from a CI artifact and commit
  # them — see docs/testing-strategy.md.

  e2e:
    name: E2E (production build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    name: Build + bundle budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size-limit

  required:
    name: Required CI
    if: ${{ always() }}
    needs:
      - quality
      - unit
      - mutation
      - arch
      - browser
      - a11y
      - touch
      - e2e
      - build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS_JSON"

  release:
    name: Release verified main commit
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.required.result == 'success'
    needs: required
    runs-on: ubuntu-latest
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      # The one job allowed to write: it pushes the release tag for the
      # verified commit (and the changelog action creates the GitHub release
      # from it). Every other job in this workflow is contents: read.
      contents: write # pushes the release tag
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Ensure releases remain in commit order
        id: order
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -n "$LATEST_TAG" ] && ! git merge-base --is-ancestor "$LATEST_TAG" "$EXPECTED_SHA"; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo "Skipping $EXPECTED_SHA because $LATEST_TAG is not its ancestor."
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create conventional release
        id: changelog
        if: steps.order.outputs.release == 'true'
        uses: TriPSs/conventional-changelog-action@ee43def3241429afddab215ba89090cbf64fb45c # v6
        with:
          create-summary: 'true'
          git-push: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: 'false'
          skip-commit: 'true'
          skip-git-pull: 'true'
          skip-version-file: 'true'
          tag-prefix: 'v'

      - name: Publish tag for the verified commit
        if: |
          steps.order.outputs.release == 'true' &&
          steps.changelog.outputs.skipped == 'false'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Refusing invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "Tag $RELEASE_TAG points to $TAG_SHA, expected $EXPECTED_SHA." >&2
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
