name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  quality:
    name: Lint, types, dead code
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm lint:check
      # Formatting is fixed automatically on commit by lint-staged, which only
      # sees staged files. This is the check that catches everything else.
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm knip

  unit:
    name: Unit tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:unit

  mutation:
    name: Mutation score (unit tier)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Grades the unit tier's assertions, not its coverage. Fails under the
      # `thresholds.break` in stryker.config.mjs — see docs/mutation-testing.md.
      - run: pnpm test:mutation
      - name: Upload mutation report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: ignore
          retention-days: 7

  arch:
    name: Architecture tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:arch

  browser:
    name: Browser tier (${{ matrix.shard }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm exec vitest run --project=default --shard="$SHARD"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # The shard is written "1/2"; artifact names may not contain a slash.
          name: vitest-traces-browser-${{ strategy.job-index }}
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  a11y:
    name: Accessibility tier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test:a11y
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-traces-a11y
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  touch:
    name: Touch tier (coarse pointer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      # Its own Chromium boot, and worth it: every other browser job launches
      # a desktop profile, so a mobile-first app had no job that experienced
      # it the way its users do.
      - run: pnpm test:touch
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vitest-traces-touch
          path: .vitest/traces
          if-no-files-found: ignore
          retention-days: 7

  # The visual tier is a local tool by default: its screenshot baselines are
  # platform-specific (font rendering differs between macOS and Linux). To
  # run it in CI, generate Linux baselines once from a CI artifact and commit
  # them — see docs/testing-strategy.md.

  e2e:
    name: E2E (production build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          playwright: 'true'
      - run: pnpm test:e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  build:
    name: Build + bundle budget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm size-limit
